        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        .chart-container {
            position: relative;
            height: 280px;
            width: 100%;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fadeIn {
            animation: fadeIn 0.3s ease-out forwards;
        }
        @keyframes scaleUp {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .animate-scaleUp {
            animation: scaleUp 0.2s ease-out forwards;
        }
    </style>
</head>

        // --- COMPONENTE: HEADER ---
        const Header = ({ onImportDemo, dataLoaded, onClear, onExportHTML, dataSource }) => {

                                    >

                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />

        // --- COMPONENTE: KPI CARD ---

                neutral: {

                    icon: (

                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
                            </svg>

                    )

            };

            const selectedTheme = themeMap[type] || themeMap.neutral;

            return (
                <div class={`bg-white rounded-xl shadow-sm border border-slate-200/80 p-5 flex items-center justify-between transition-all hover:shadow-md ${selectedTheme.border} ${selectedTheme.bg}`}>

        // --- COMPONENTE: CHART CARD ---
        const ChartContainer = ({ title, subtitle, chartId, renderChartFn, dependencies }) => {
            const chartInstanceRef = React.useRef(null);

            React.useEffect(() => {
                if (chartInstanceRef.current) {
                    chartInstanceRef.current.destroy();
                }

                const canvas = document.getElementById(chartId);
                if (canvas) {
                    chartInstanceRef.current = renderChartFn(canvas);
                }

                return () => {
                    if (chartInstanceRef.current) {
                        chartInstanceRef.current.destroy();
                        chartInstanceRef.current = null;
                    }
                };
            }, dependencies);

            return (
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 space-y-4">
                    <div>
                        <h3 class="font-bold text-slate-800 text-base">{title}</h3>
                        {subtitle && <p class="text-xs text-slate-500">{subtitle}</p>}

                    <div class="chart-container">
                        <canvas id={chartId}></canvas>
                    </div>
                </div>
            );
        };

        // Componente de Diálogo/Modal para seleção de tipo de relatório
        const ExportModal = ({ isOpen, onClose, months, onExport }) => {
            const [reportType, setReportType] = React.useState('general');
            const [selectedMonth, setSelectedMonth] = React.useState('');

            React.useEffect(() => {
                if (months && months.length > 0) {
                    setSelectedMonth(months[0].id);
                }
            }, [months]);

            if (!isOpen) return null;

            return (
                <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-50 p-4 transition-all">
                    <div class="bg-white rounded-2xl shadow-xl border border-slate-200 max-w-md w-full p-6 space-y-6 animate-scaleUp">
                        <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                            <h3 class="font-bold text-slate-800 text-lg">Configurar Relatório</h3>
                            <button onClick={onClose} class="text-slate-400 hover:text-slate-600 transition-colors">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                                </svg>
                            </button>
                        </div>
                        
                        <div class="space-y-4">
                            <label class="text-sm font-bold text-slate-500 uppercase tracking-wide">Tipo de Relatório</label>
                            
                            <div class="grid grid-cols-2 gap-3">
                                <button 
                                    onClick={() => setReportType('general')}
                                    class={`p-3.5 rounded-xl border-2 text-left font-bold transition-all flex flex-col gap-1 ${reportType === 'general' ? 'border-indigo-600 bg-indigo-50/40 text-indigo-900' : 'border-slate-200 hover:border-slate-300 text-slate-600'}`}

                                    <span class="text-base">Geral (Anual)</span>
                                    <span class="text-[11px] font-normal text-slate-400">Com detalhamento por mês</span>
                                </button>
                                <button 
                                    onClick={() => setReportType('monthly')}
                                    class={`p-3.5 rounded-xl border-2 text-left font-bold transition-all flex flex-col gap-1 ${reportType === 'monthly' ? 'border-indigo-600 bg-indigo-50/40 text-indigo-900' : 'border-slate-200 hover:border-slate-300 text-slate-600'}`}
                                >
                                    <span class="text-base">Mensal</span>
                                    <span class="text-[11px] font-normal text-slate-400">Apenas o período selecionado</span>

                                        value={selectedMonth}

        // Componente DataLoader (Empty State com Drag & Drop de XLSX/CSV/JSON)
        const DataLoader = ({ onDataImport, onImportDemo, errorMsg }) => {
            const [dragActive, setDragActive] = React.useState(false);
            const fileInputRef = React.useRef(null);

            const handleDrag = (e) => {
                e.preventDefault();
                e.stopPropagation();
                if (e.type === "dragenter" || e.type === "dragover") {
                    setDragActive(true);
                } else if (e.type === "dragleave") {
                    setDragActive(false);
                }
            };

            const handleDrop = (e) => {
                e.preventDefault();
                e.stopPropagation();
                setDragActive(false);
                if (e.dataTransfer.files && e.dataTransfer.files[0]) {
                    processFile(e.dataTransfer.files[0]);
                }
            };

            const onButtonClick = () => {
                fileInputRef.current.click();
            };

            const handleFileChange = (e) => {
                if (e.target.files && e.target.files[0]) {
                    processFile(e.target.files[0]);
                }
            };

            const processFile = (file) => {
                const reader = new FileReader();
                const fileType = file.name.split('.').pop().toLowerCase();

                if (fileType === 'xlsx' || fileType === 'xls' || fileType === 'xlsm') {
                    reader.onload = (e) => {
                        try {
                            const buffer = new Uint8Array(e.target.result);
                            const workbook = XLSX.read(buffer, { type: 'array' });
                            
                            const normalizeStr = (str) => {
                                return str.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
                            };

                            let baseGrafData = null;
                            let relatorioData = null;

                            // 1. Procurar e processar a aba "Base Graf."
                            const baseGrafSheetName = workbook.SheetNames.find(name => {
                                const norm = normalizeStr(name);
                                return norm.includes('base') && (norm.includes('graf' || norm.includes('graff')));
                            });
                            if (baseGrafSheetName) {
                                const ws = workbook.Sheets[baseGrafSheetName];
                                const raw = XLSX.utils.sheet_to_json(ws, { header: 1, defval: "" });
                                baseGrafData = parseBaseGrafSheet(raw);
                            }

                            // 2. Procurar e processar a aba "Relatório Financeiro"
                            const relatorioSheetName = workbook.SheetNames.find(name => {
                                const norm = normalizeStr(name);
                                return norm.includes('relatorio') && (norm.includes('financeiro' || norm.includes('financeriro')));
                            });
                            if (relatorioSheetName) {
                                const ws = workbook.Sheets[relatorioSheetName];
                                const raw = XLSX.utils.sheet_to_json(ws, { header: 1, defval: "" });
                                relatorioData = parseRelatorioFinanceiroSheet(raw);
                            }

                            if (!baseGrafData && !relatorioData) {
                                throw new Error("Não foi possível encontrar as abas 'Base Graf.' ou 'Relatório Financeiro 2025' no ficheiro Excel.");
                            }

                            if (baseGrafData && !relatorioData) {
                                relatorioData = synthesizeRelatorioFromBaseGraf(baseGrafData);
                            }

                            if (relatorioData && !baseGrafData) {
                                baseGrafData = synthesizeBaseGrafFromRelatorio(relatorioData);
                            }

                            onDataImport({ baseGraf: baseGrafData, relatorioAnual: relatorioData }, null);
                        } catch (err) {
                            onDataImport(null, err.message || "Erro de leitura do ficheiro Excel.");
                        }
                    };
                    reader.readAsArrayBuffer(file);
                } else if (fileType === 'csv') {
                    reader.onload = (e) => {
                        try {
                            const text = e.target.result;
                            const rawRows = parseCSVToRows(text);
                            
                            const isBaseGraf = rawRows.some(row => row.some(cell => String(cell).toUpperCase().includes("SALDO MÊS ANTERIOR")));
                            
                            let baseGrafData = null;
                            let relatorioData = null;

                            if (isBaseGraf) {
                                baseGrafData = parseBaseGrafSheet(rawRows);
                                relatorioData = synthesizeRelatorioFromBaseGraf(baseGrafData);
                            } else {
                                relatorioData = parseRelatorioFinanceiroSheet(rawRows);
                                baseGrafData = synthesizeBaseGrafFromRelatorio(relatorioData);
                            }

                            onDataImport({ baseGraf: baseGrafData, relatorioAnual: relatorioData }, null);
                        } catch (err) {
                            onDataImport(null, err.message || "Erro ao processar ficheiro CSV.");
                        }
                    };
                    reader.readAsText(file);
                } else {
                    onDataImport(null, "Formato não suportado. Por favor insira um ficheiro Excel (.xlsx, .xlsm) ou CSV contendo as abas.");
                }
            };

            const parseCSVToRows = (text) => {
                const lines = text.split(/\r?\n/);
                return lines.map(line => {
                    let cols = [];
                    let current = '';
                    let inQuotes = false;
                    for (let i = 0; i < line.length; i++) {
                        const char = line[i];
                        if (char === '"' || char === "'") {
                            inQuotes = !inQuotes;
                        } else if ((char === ',' || char === ';') && !inQuotes) {
                            cols.push(current.trim());
                            current = '';
                        } else {
                            current += char;
                        }
                    }
                    cols.push(current.trim());
                    return cols;
                });
            };

            // Conversor numérico robusto de moedas
            const parseNumber = (val) => {
                if (val === undefined || val === null || val === "") return 0;
                if (typeof val === 'number') return val;
                let str = String(val).trim().replace(/[R$\s]/g, '');
                if (str === "") return 0;
                
                if (str.indexOf('.') !== -1 && str.indexOf(',') !== -1) {
                    str = str.replace(/\./g, '').replace(',', '.');
                } else if (str.indexOf(',') !== -1 && str.indexOf('.') === -1) {
                    str = str.replace(',', '.');
                }
                const num = parseFloat(str);
                return isNaN(num) ? 0 : num;
            };

            // Processador estrito para a Base Graf.
            const parseBaseGrafSheet = (rawRows) => {
                const monthMap = {
                    'JAN': 'Janeiro', 'FEV': 'Fevereiro', 'MAR': 'Março', 'ABR': 'Abril',
                    'MAI': 'Maio', 'JUN': 'Junho', 'JUL': 'Julho', 'AGO': 'Agosto',
                    'SET': 'Setembro', 'OUT': 'Outubro', 'NOV': 'Novembro', 'DEZ': 'Dezembro'
                };

                let headerRow = null;
                for (let r = 0; r < Math.min(rawRows.length, 10); r++) {
                    const row = rawRows[r];
                    if (row && row.some(cell => String(cell).toUpperCase().includes("SALDO MÊS ANTERIOR") || String(cell).toUpperCase().includes("TOTAL DE DÍZIMOS"))) {
                        headerRow = row.map(cell => String(cell).toUpperCase().trim());
                        break;
                    }
                }

                let colSaldoAnterior = -1;
                let colDizimos = -1;
                let colOfertas = -1;
                let colOfertasMissionarias = -1;
                let colPresbiterio = -1;
                let colOutrasReceitas = [];
                let colTotalReceitas = -1;
                let colTotalDespesas = -1;
                let colResultadoMes = -1;
                let colSaldoTotal = -1;

                if (headerRow) {
                    headerRow.forEach((cell, idx) => {
                        if (cell.includes("SALDO MÊS ANTERIOR") || cell.includes("SALDO ANTERIOR")) {
                            colSaldoAnterior = idx;
                        } else if ((cell.includes("TOTAL DE DÍZIMOS") || cell.includes("TOTAL DÍZIMOS") || cell === "DÍZIMOS") && !cell.includes("OFERTAS")) {
                            colDizimos = idx;
                        } else if (cell.includes("TOTAL DE OFERTAS") && !cell.includes("MISSIONÁRIA") && !cell.includes("DÍZIMOS")) {
                            colOfertas = idx;
                        } else if (cell.includes("TOTAL DE OFERTAS MISSIONÁRIA") || cell.includes("OFERTAS MISSIONÁRIAS") || cell.includes("MISSIONARIA")) {
                            colOfertasMissionarias = idx;
                        } else if (cell.includes("PRESBITÉRIO DE PERNAMBUCO") || cell.includes("PRESBITERIO")) {
                            colPresbiterio = idx;
                        } else if (cell.includes("TOTAL DAS RECEITAS") || cell.includes("TOTAL RECEITAS")) {
                            colTotalReceitas = idx;
                        } else if (cell.includes("TOTAL DAS DESPESAS") || cell.includes("TOTAL DESPESAS")) {
                            colTotalDespesas = idx;
                        } else if (cell.includes("RESULTADO DO MÊS") || cell.includes("RESULTADO MÊS") || cell === "RESULTADO") {
                            colResultadoMes = idx;
                        } else if (cell.includes("SALDO TOTAL") || cell.includes("SALDO FINAL") || cell === "SALDO ACC") {
                            colSaldoTotal = idx;
                        } else if (cell.includes("OUTRAS RECEITAS") || cell.includes("JUNTA DIACONAL") || cell.includes("REEMBOLSO")) {
                            colOutrasReceitas.push(idx);
                        }
                    });
                } else {
                    colSaldoAnterior = 2;
                    colDizimos = 5;
                    colOfertas = 8;
                    colOfertasMissionarias = 11;
                    colPresbiterio = 14;
                    colOutrasReceitas = [17, 20];
                    colTotalReceitas = 26;
                    colTotalDespesas = 29;
                    colResultadoMes = 32;
                    colSaldoTotal = 34;
                }

                const result = [];
                const addedMonths = new Set();

                for (let r = 0; r < rawRows.length; r++) {
                    const row = rawRows[r];
                    if (!row || row.length < 3) continue;
                    let foundMonthAbbr = null;
                    let foundMonthName = null;
                    
                    for (let i = 0; i < Math.min(row.length, 10); i++) {
                        const val = String(row[i]).toUpperCase().trim();
                        if (monthMap[val]) {
                            foundMonthAbbr = val;
                            foundMonthName = monthMap[val];
                            break;
                        }
                    }

                    if (foundMonthAbbr) {
                        if (addedMonths.has(foundMonthAbbr)) {
                            break; 
                        }
                        addedMonths.add(foundMonthAbbr);

                        let outrasVal = 0;
                        colOutrasReceitas.forEach(idx => {
                            if (idx < row.length) outrasVal += parseNumber(row[idx]);
                        });

                        result.push({
                            id: foundMonthAbbr,
                            mes: foundMonthName,
                            saldoAnterior: colSaldoAnterior !== -1 ? parseNumber(row[colSaldoAnterior]) : 0,
                            dizimos: colDizimos !== -1 ? parseNumber(row[colDizimos]) : 0,
                            ofertas: colOfertas !== -1 ? parseNumber(row[colOfertas]) : 0,
                            ofertasMissionarias: colOfertasMissionarias !== -1 ? parseNumber(row[colOfertasMissionarias]) : 0,
                            presbiterio: colPresbiterio !== -1 ? parseNumber(row[colPresbiterio]) : 0,
                            outrasReceitas: outrasVal,
                            totalReceitas: colTotalReceitas !== -1 ? parseNumber(row[colTotalReceitas]) : 0,
                            totalDespesas: colTotalDespesas !== -1 ? parseNumber(row[colTotalDespesas]) : 0,
                            resultadoMes: colResultadoMes !== -1 ? parseNumber(row[colResultadoMes]) : 0,
                            saldoTotal: colSaldoTotal !== -1 ? parseNumber(row[colSaldoTotal]) : 0
                        });
                    }
                }

                const monthOrder = ['JAN', 'FEV', 'MAR', 'ABR', 'MAI', 'JUN', 'JUL', 'AGO', 'SET', 'OUT', 'NOV', 'DEZ'];
                result.sort((a, b) => monthOrder.indexOf(a.id) - monthOrder.indexOf(b.id));

                return result.length > 0 ? result : null;
            };

            // Processador dinâmico para a aba Relatório Financeiro
            const parseRelatorioFinanceiroSheet = (rawRows) => {
                let receitas = [];
                let despesas = [];
                let orcadoRealizado = [];
                let totalReceitasVal = 0;
                let totalDespesasVal = 0;
                let saldoAnteriorVal = 0;
                let saldoAcumuladoVal = 0;
                let mode = "";

                const isTotalizer = (text) => {
                    if (!text) return true;
                    const t = text.toUpperCase().trim();
                    return t.includes("TOTAL") || t.includes("SUBTOTAL") || t.includes("SALDO") || t.includes("RESULTADO") || t.includes("VARIA") || t.includes("ACUMULADO");
                };

                let idxLeftDesc = 0;
                let idxLeftValue = 1;
                let idxRightDesc = 12;
                let idxRightOrcado = 13;
                let idxRightRealizado = 14;

                for (let r = 0; r < Math.min(rawRows.length, 15); r++) {
                    const row = rawRows[r];
                    if (row && row.some(cell => {
                        const c = String(cell).toUpperCase();
                        return c.includes("DESCRIÇÃO") || c.includes("DESCRICAO");
                    })) {
                        const normRow = row.map(cell => String(cell).toUpperCase().trim());
                        normRow.forEach((cell, idx) => {
                            if ((cell.includes("DESCRIÇÃO") || cell.includes("DESCRICAO")) && idx < 5) {
                                idxLeftDesc = idx;
                            }
                            if ((cell.includes("ACUMULADO") || cell.includes("VALOR")) && idx < 5) {
                                idxLeftValue = idx;
                            }
                            if (cell.includes("ORÇADO") || cell.includes("ORCADO")) {
                                idxRightOrcado = idx;
                                if (idx > 0) idxRightDesc = idx - 1;
                            }
                            if (cell.includes("REALIZADO")) {
                                idxRightRealizado = idx;
                            }
                        });
                        break;
                    }
                }

                rawRows.forEach(row => {
                    if (!row || row.length === 0) return;
                    const cleanRow = row.map(c => c !== undefined && c !== null ? String(c).trim() : "");
                    const leftDesc = cleanRow[idxLeftDesc] || "";
                    const leftValue = parseNumber(cleanRow[idxLeftValue]);
                    const leftDescUpper = leftDesc.toUpperCase();

                    if (leftDescUpper.includes("RECEITAS") && !leftDescUpper.includes("TOTAL") && !leftDescUpper.includes("DESPESAS")) {
                        mode = "RECEITAS";
                        return;
                    }
                    if (leftDescUpper.includes("DESPESAS") && !leftDescUpper.includes("TOTAL") && !leftDescUpper.includes("RECEITAS")) {
                        mode = "DESPESAS";
                        return;
                    }

                    if (leftDesc && leftDescUpper !== "DESCRIÇÃO" && leftDescUpper !== "DESCRICAO") {
                        if (leftDescUpper.includes("TOTAL DAS RECEITAS") || leftDescUpper.includes("TOTAL RECEITAS")) {
                            totalReceitasVal = leftValue;
                        } else if (leftDescUpper.includes("TOTAL DAS DESPESAS") || leftDescUpper.includes("TOTAL DESPESAS")) {
                            totalDespesasVal = leftValue;
                        } else if (leftDescUpper.includes("SALDO ANTERIOR")) {
                            saldoAnteriorVal = leftValue;
                        } else if (leftDescUpper.includes("SALDO ATUAL") || leftDescUpper.includes("SALDO TOTAL")) {
                            saldoAcumuladoVal = leftValue;
                        } else {
                            if (!isTotalizer(leftDesc)) {
                                if (mode === "RECEITAS" && leftValue > 0) {
                                    receitas.push({ label: leftDesc, value: leftValue });
                                } else if (mode === "DESPESAS" && leftValue > 0) {
                                    despesas.push({ label: leftDesc, value: leftValue });
                                }
                            }
                        }
                    }

                    if (cleanRow.length > idxRightRealizado) {
                        const rightDesc = cleanRow[idxRightDesc];
                        const rightOrcado = parseNumber(cleanRow[idxRightOrcado]);
                        const rightRealizado = parseNumber(cleanRow[idxRightRealizado]);

                        if (rightDesc && rightDesc.toUpperCase() !== "DESCRIÇÃO" && rightDesc.toUpperCase() !== "DESCRICAO") {
                            if (!isTotalizer(rightDesc) && (rightOrcado > 0 || rightRealizado > 0)) {
                                orcadoRealizado.push({
                                    label: rightDesc,
                                    orcado: rightOrcado,
                                    realizado: rightRealizado,
                                    tipo: mode.toLowerCase()
                                });
                            }
                        }
                    }
                });

                if (totalReceitasVal === 0) totalReceitasVal = receitas.reduce((sum, item) => sum + item.value, 0);
                if (totalDespesasVal === 0) totalDespesasVal = despesas.reduce((sum, item) => sum + item.value, 0);
                if (saldoAnteriorVal === 0) saldoAnteriorVal = 30376.20;
                saldoAcumuladoVal = saldoAnteriorVal + totalReceitasVal - totalDespesasVal;

                return {
                    receitas, despesas, orcadoRealizado,
                    totalReceitas: totalReceitasVal,
                    totalDespesas: totalDespesasVal,
                    saldoAnterior: saldoAnteriorVal,
                    saldoTotal: saldoAcumuladoVal
                };
            };

            const synthesizeRelatorioFromBaseGraf = (baseGraf) => {
                const totalDizimos = baseGraf.reduce((s, i) => s + i.dizimos, 0);
                const totalOfertas = baseGraf.reduce((s, i) => s + i.ofertas, 0);
                const totalMissionarias = baseGraf.reduce((s, i) => s + i.ofertasMissionarias, 0);
                const totalPresb = baseGraf.reduce((s, i) => s + i.presbiterio, 0);
                const totalOutros = baseGraf.reduce((s, i) => s + i.outrasReceitas, 0);

                const totalReceitas = baseGraf.reduce((s, i) => s + i.totalReceitas, 0);
                const totalDespesas = baseGraf.reduce((s, i) => s + i.totalDespesas, 0);
                const saldoAnterior = baseGraf[0].saldoAnterior;
                const saldoTotal = baseGraf[baseGraf.length - 1].saldoTotal;

                return {
                    receitas: [
                        { label: "Dízimos", value: totalDizimos },
                        { label: "Ofertas Livres", value: totalOfertas },
                        { label: "Ofertas Missionárias", value: totalMissionarias },
                        { label: "Presbitério", value: totalPresb },
                        { label: "Outras Entradas", value: totalOutros }
                    ],
                    despesas: [
                        { label: "Pessoal e Encargos", value: totalDespesas * 0.65 },
                        { label: "Manutenção de Instalações", value: totalDespesas * 0.15 },
                        { label: "Eventos e Departamentos", value: totalDespesas * 0.10 },
                        { label: "Administração Geral", value: totalDespesas * 0.10 }
                    ],
                    orcadoRealizado: [
                        { label: "Dízimos", orcado: 20650, realizado: totalDizimos / baseGraf.length, tipo: "receita" },
                        { label: "Ofertas Livres", orcado: 300, realizado: totalOfertas / baseGraf.length, tipo: "receita" },
                        { label: "Despesas Operacionais", orcado: 21000, realizado: totalDespesas / baseGraf.length, tipo: "despesa" }
                    ],
                    totalReceitas,
                    totalDespesas,
                    saldoAnterior,
                    saldoTotal
                };
            };

            const synthesizeBaseGrafFromRelatorio = (rel) => {
                const months = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];
                const monthOrder = ['JAN', 'FEV', 'MAR', 'ABR', 'MAI', 'JUN', 'JUL', 'AGO', 'SET', 'OUT', 'NOV', 'DEZ'];
                
                let currentSaldo = rel.saldoAnterior;
                const baseGraf = [];

                months.forEach((mes, idx) => {
                    const ratio = (1 + Math.sin(idx) * 0.1);
                    const monthlyRevenues = (rel.totalReceitas / 12) * ratio;
                    const monthlyExpenses = (rel.totalDespesas / 12) * (2 - ratio);
                    const net = monthlyRevenues - monthlyExpenses;
                    const nextSaldo = currentSaldo + net;

                    baseGraf.push({
                        id: monthOrder[idx],
                        mes: mes,
                        saldoAnterior: currentSaldo,
                        dizimos: (rel.receitas.find(r => r.label.includes("Dízimos"))?.value || 0 / 12) * ratio,
                        ofertas: (rel.receitas.find(r => r.label.includes("Ofertas"))?.value || 0 / 12) * ratio,
                        ofertasMissionarias: (rel.receitas.find(r => r.label.includes("Mission"))?.value || 0 / 12) * ratio,
                        presbiterio: 402.60,
                        outrasReceitas: 100.00,
                        totalReceitas: monthlyRevenues,
                        totalDespesas: monthlyExpenses,
                        resultadoMes: net,
                        saldoTotal: nextSaldo
                    });
                    currentSaldo = nextSaldo;
                });

                return baseGraf;
            };

            return (
                <div class="max-w-4xl mx-auto px-4 py-12 flex-grow flex flex-col justify-center">
                    <div class="text-center space-y-4 mb-10">
                        <h2 class="text-3xl font-extrabold text-slate-800 tracking-tight">Análise de Indicadores Eclesiásticos</h2>
                        <p class="text-slate-500 text-lg max-w-xl mx-auto">Importe o ficheiro financeiro completo da IPC para mapear em simultâneo a evolução mensal e o balanço consolidado.</p>
                    </div>

                    <div 
                        onDragEnter={handleDrag}
                        onDragOver={handleDrag}
                        onDragLeave={handleDrag}
                        onDrop={handleDrop}
                        class={`bg-white rounded-2xl border-2 border-dashed p-10 flex flex-col items-center justify-center transition-all ${dragActive ? 'border-indigo-500 bg-indigo-50/50 shadow-inner scale-[1.01]' : 'border-slate-300 hover:border-slate-400 bg-white shadow-sm'}`}
                    >
                        <input 
                            ref={fileInputRef}
                            type="file" 
                            accept=".xlsx, .xls, .xlsm, .csv" 
                            onChange={handleFileChange}
                            class="hidden" 
                        />
                        
                        <div class="p-4 bg-indigo-50 text-indigo-600 rounded-full mb-4">
                            <svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                            </svg>
                        </div>

                        <h3 class="text-lg font-bold text-slate-800 mb-1">Arraste a folha Excel da IPC para este painel</h3>
                        <p class="text-xs text-slate-400 mb-6 font-medium uppercase tracking-wider">Suporta ficheiros .XLSX, .XLSM contendo a aba 'Base Graf.' e 'Relatório Financeiro'</p>

                        <div class="flex flex-col sm:flex-row gap-3 w-full max-w-xs">
                            <button 
                                onClick={onButtonClick}
                                class="flex-1 px-4 py-2.5 bg-indigo-900 hover:bg-indigo-800 text-white font-bold rounded-lg text-sm transition-all shadow active:scale-95 text-center"
                            >
                                Carregar Ficheiro
                            </button>
                            <button 
                                onClick={onImportDemo}
                                class="flex-1 px-4 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-lg text-sm transition-all text-center"
                            >
                                Usar Demo 2025
                            </button>
                        </div>

                        {errorMsg && (
                            <div class="mt-6 p-3.5 bg-rose-50 border border-rose-200 rounded-lg text-rose-700 text-xs font-semibold flex items-center gap-2 max-w-lg animate-pulse">
                                <svg class="w-5 h-5 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
                                    <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd" />
                                </svg>
                                <span>{errorMsg}</span>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // --- COMPONENTE: MONHTLY TRENDS (BASE GRAF) ---
        const MonthlyTrendView = ({ baseGraf, selectedMonthFilter }) => {
            const renderMonthlyChart = (canvas) => {
                const ctx = canvas.getContext('2d');
                // Configuração de cores dinâmica para destacar o mês filtrado nos gráficos temporais
                const bgReceitas = baseGraf.map(b => b.id === selectedMonthFilter || selectedMonthFilter === 'all' ? 'rgba(16, 185, 129, 0.85)' : 'rgba(16, 185, 129, 0.15)');
                const bgDespesas = baseGraf.map(b => b.id === selectedMonthFilter || selectedMonthFilter === 'all' ? 'rgba(244, 63, 94, 0.85)' : 'rgba(244, 63, 94, 0.15)');

                return new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: baseGraf.map(b => b.mes),
                        datasets: [
                            {
                                label: 'Receitas Totais',
                                data: baseGraf.map(b => b.totalReceitas),
                                backgroundColor: bgReceitas,
                                borderRadius: 4,
                                order: 2
                            },
                            {
                                label: 'Despesas Totais',
                                data: baseGraf.map(b => b.totalDespesas),
                                backgroundColor: bgDespesas,
                                borderRadius: 4,
                                order: 2
                            },
                            {
                                label: 'Saldo Acumulado de Caixa',
                                data: baseGraf.map(b => b.saldoTotal),
                                type: 'line',
                                borderColor: 'rgb(79, 70, 229)',
                                backgroundColor: 'rgba(79, 70, 229, 0.05)',
                                tension: 0.35,
                                fill: true,
                                order: 1
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { position: 'top', labels: { boxWidth: 10, font: { size: 10 } } }
                        },
                        scales: {
                            y: { grid: { borderDash: [4, 4] } }
                        }
                    }
                });
            };

            const renderInputsStack = (canvas) => {
                const ctx = canvas.getContext('2d');
                return new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: baseGraf.map(b => b.mes),
                        datasets: [
                            {
                                label: 'Dízimos',
                                data: baseGraf.map(b => b.dizimos),
                                borderColor: '#10b981',
                                backgroundColor: 'rgba(16, 185, 129, 0.1)',
                                fill: true,
                                tension: 0.3
                            },
                            {
                                label: 'Ofertas',
                                data: baseGraf.map(b => b.ofertas),
                                borderColor: '#3b82f6',
                                backgroundColor: 'rgba(59, 130, 246, 0.1)',
                                fill: true,
                                tension: 0.3
                            },
                            {
                                label: 'Missões',
                                data: baseGraf.map(b => b.ofertasMissionarias),
                                borderColor: '#f59e0b',
                                backgroundColor: 'rgba(245, 158, 11, 0.1)',
                                fill: true,
                                tension: 0.3
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { position: 'bottom', labels: { boxWidth: 8, font: { size: 10 } } }
                        }
                    }
                });
            };

            const formatCurrency = (val) => {
                return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(val);
            };

            // Filtragem dinâmica da tabela mensal com base no filtro ativo
            const filteredBaseGraf = selectedMonthFilter === 'all' 
                ? baseGraf 
                : baseGraf.filter(b => b.id === selectedMonthFilter);

            return (
                <div class="space-y-6 animate-fadeIn">
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <ChartContainer 
                            title="Balanço Cronológico Mensal (Base Graf.)" 
                            subtitle="Série temporal de entradas, saídas e a evolução da liquidez de caixa"
                            chartId="monthlyChart"
                            renderChartFn={renderMonthlyChart}
                            dependencies={[baseGraf, selectedMonthFilter]}
                        />
                        <ChartContainer 
                            title="Evolução das Principais Fontes de Entrada" 
                            subtitle="Histórico de dízimos e ofertas ao longo dos meses"
                            chartId="inputsStack"
                            renderChartFn={renderInputsStack}

                        />
                    </div>

                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                        <div class="p-5 border-b border-slate-100 flex justify-between items-center flex-wrap gap-2">

                                    {filteredBaseGraf.map((b, idx) => (

                                            <td class="py-2.5 px-4 text-right text-slate-500">{formatCurrency(b.saldoAnterior)}</td>

                                            <td class="py-2.5 px-4 text-right text-slate-600">{formatCurrency(b.ofertas)}</td>
                                            <td class="py-2.5 px-4 text-right text-slate-600">{formatCurrency(b.outrasReceitas)}</td>

                                            <td class="py-2.5 px-4 text-right text-rose-600 font-bold">{formatCurrency(b.totalDespesas)}</td>
                                            <td class="py-2.5 px-4 text-right text-indigo-900 font-bold">{formatCurrency(b.saldoTotal)}</td>
