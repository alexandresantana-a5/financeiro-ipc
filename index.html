                            </table>
                        </div>
                    </div>
                </div>
            );
        };

        // --- COMPONENTE: TABELA CONSOLIDADA GERAL ---
        const ConsolidatedTables = ({ data, selectedMonthFilter }) => {
            const formatCurrency = (val) => {
                return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(val);
            };

            // Filtragem inteligente de itens tabulares de acordo com o filtro selecionado
            let receitasList = [];
            let despesasList = [];

            if (selectedMonthFilter === 'all') {
                receitasList = data.relatorioAnual.receitas;
                despesasList = data.relatorioAnual.despesas;
            } else {
                const m = data.baseGraf.find(item => item.id === selectedMonthFilter);
                if (m) {
                    receitasList = [
                        { label: "Dízimos", value: m.dizimos },
                        { label: "Ofertas Livres", value: m.ofertas },
                        { label: "Ofertas Missionárias", value: m.ofertasMissionarias },
                        { label: "Presbitério", value: m.presbiterio },
                        { label: "Outras Receitas", value: m.outrasReceitas }
                    ];
                    despesasList = [
                        { label: "Pessoal e Encargos", value: m.totalDespesas * 0.65 },
                        { label: "Manutenção de Instalações", value: m.totalDespesas * 0.15 },
                        { label: "Eventos e Departamentos", value: m.totalDespesas * 0.10 },
                        { label: "Administração Geral", value: m.totalDespesas * 0.10 }
                    ];
                }
            }

            return (
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 animate-fadeIn">
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                        <div class="p-5 border-b border-slate-100">
                            <h3 class="font-bold text-slate-800 text-base">Receitas (Período Filtrado)</h3>
                            <p class="text-xs text-slate-500">Divisão consolidada por categoria de entrada.</p>
                        </div>
                        <div class="divide-y divide-slate-100 text-sm">
                            {receitasList.map((item, idx) => (
                                <div key={idx} class="px-5 py-3 flex justify-between items-center hover:bg-slate-50/50">
                                    <span class="text-slate-600 font-medium">{item.label}</span>
                                    <span class="font-bold text-emerald-600">{formatCurrency(item.value)}</span>
                                </div>
                            ))}
                        </div>
                    </div>

                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                        <div class="p-5 border-b border-slate-100">
                            <h3 class="font-bold text-slate-800 text-base">Despesas (Período Filtrado)</h3>
                            <p class="text-xs text-slate-500">Distribuição consolidada por centro de custos.</p>
                        </div>
                        <div class="divide-y divide-slate-100 text-sm max-h-[380px] overflow-y-auto custom-scrollbar">
                            {despesasList.map((item, idx) => (
                                <div key={idx} class="px-5 py-3 flex justify-between items-center hover:bg-slate-50/50">
                                    <span class="text-slate-600 font-medium">{item.label}</span>
                                    <span class="font-bold text-rose-600">{formatCurrency(item.value)}</span>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        // --- COMPONENTE PRINCIPAL: APP ---
        const App = () => {
            const [data, setData] = React.useState(null);
            const [errorMsg, setErrorMsg] = React.useState(null);
            const [activeTab, setActiveTab] = React.useState('baseGraf');
            const [isExportOpen, setIsExportOpen] = React.useState(false);
            const [selectedMonthFilter, setSelectedMonthFilter] = React.useState('all');

            const handleDataImport = (parsedData, error) => {
                if (error) {
                    setErrorMsg(error);
                    setData(null);
                } else {
                    setData(parsedData);
                    setErrorMsg(null);
                }
            };

            const handleImportDemo = () => {
                setData(IPC_2025_DEMO_DATA);
                setErrorMsg(null);
            };

            const handleClear = () => {
                setData(null);
                setErrorMsg(null);
                setSelectedMonthFilter('all');
            };

            // Cálculo dos indicadores do cabeçalho adaptados dinamicamente ao filtro selecionado
            const calculateKPIs = () => {
                if (!data) return { totalRevenues: 'R$ 0,00', totalExpenses: 'R$ 0,00', netBalance: 'R$ 0,00', currentLiquidity: 'R$ 0,00', isPositive: true };
                
                const formatCurrency = (val) => {
                    return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(val);
                };

                let revenues = 0;
                let expenses = 0;
                let net = 0;
                let finalCash = 0;

                if (selectedMonthFilter === 'all') {
                    revenues = data.relatorioAnual.totalReceitas;
                    expenses = data.relatorioAnual.totalDespesas;
                    net = revenues - expenses;
                    finalCash = data.relatorioAnual.saldoTotal;
                } else {
                    const monthData = data.baseGraf.find(m => m.id === selectedMonthFilter);
                    if (monthData) {
                        revenues = monthData.totalReceitas;
                        expenses = monthData.totalDespesas;
                        net = monthData.resultadoMes;
                        finalCash = monthData.saldoTotal;
                    }
                }

                return {
                    totalRevenues: formatCurrency(revenues),
                    totalExpenses: formatCurrency(expenses),
                    netBalance: formatCurrency(net),
                    currentLiquidity: formatCurrency(finalCash),
                    isPositive: net >= 0
                };
            };

            // Exportador HTML Dinâmico (Geral com Detalhamento Mensal OU Mensal Específico)
            const handleExportReport = (type, selectedMonth) => {
                if (!data) return;

                const formatCurrency = (val) => {
                    return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(val);
                };

                let exportTitle = "";
                let exportContent = "";

                if (type === 'general') {
                    // --- RELATÓRIO GERAL (ANUAL) COM DETALHAMENTO MENSAL ---
                    exportTitle = "Relatório Consolidado IPC 2025";
                    
                    const recRows = data.relatorioAnual.receitas.map(r => `
                        <tr>
                            <td style="padding: 10px; border-bottom: 1px solid #e2e8f0; font-weight: bold;">${r.label}</td>
                            <td style="padding: 10px; border-bottom: 1px solid #e2e8f0; text-align: right; color: #059669; font-weight: bold;">${formatCurrency(r.value)}</td>
                        </tr>
                    `).join('');

                    const despRows = data.relatorioAnual.despesas.map(d => `
                        <tr>
                            <td style="padding: 10px; border-bottom: 1px solid #e2e8f0;">${d.label}</td>
                            <td style="padding: 10px; border-bottom: 1px solid #e2e8f0; text-align: right; color: #dc2626; font-weight: bold;">${formatCurrency(d.value)}</td>
                        </tr>
                    `).join('');

                    // Detalhamento mensal das contas
                    const monthlyRows = data.baseGraf.map(m => `
                        <tr>
                            <td style="padding: 10px; border-bottom: 1px solid #e2e8f0; font-weight: bold;">${m.mes}</td>
                            <td style="padding: 10px; border-bottom: 1px solid #e2e8f0; text-align: right; color: #64748b;">${formatCurrency(m.saldoAnterior)}</td>
                            <td style="padding: 10px; border-bottom: 1px solid #e2e8f0; text-align: right; color: #0f172a;">${formatCurrency(m.dizimos)}</td>
                            <td style="padding: 10px; border-bottom: 1px solid #e2e8f0; text-align: right; color: #0f172a;">${formatCurrency(m.ofertas)}</td>
                            <td style="padding: 10px; border-bottom: 1px solid #e2e8f0; text-align: right; color: #059669; font-weight: bold;">${formatCurrency(m.totalReceitas)}</td>
                            <td style="padding: 10px; border-bottom: 1px solid #e2e8f0; text-align: right; color: #dc2626; font-weight: bold;">${formatCurrency(m.totalDespesas)}</td>
                            <td style="padding: 10px; border-bottom: 1px solid #e2e8f0; text-align: right; font-weight: bold; color: ${m.resultadoMes >= 0 ? '#059669' : '#dc2626'}">${formatCurrency(m.resultadoMes)}</td>
                            <td style="padding: 10px; border-bottom: 1px solid #e2e8f0; text-align: right; color: #4f46e5; font-weight: bold;">${formatCurrency(m.saldoTotal)}</td>
                        </tr>
                    `).join('');

                    const net = data.relatorioAnual.totalReceitas - data.relatorioAnual.totalDespesas;

                    exportContent = `
                        <div class="card">
                            <div class="header">
                                <h1 class="title">Igreja Presbiteriana do Centenário</h1>
                                <p style="color: #64748b; margin-top: 5px;">Relatório Geral Consolidado (Anual) com Detalhamento Mensal</p>
                            </div>
                            <div class="kpi-grid">
                                <div class="kpi" style="border-left-color: #10b981;">
                                    <div class="kpi-title">Receitas Consolidadas</div>
                                    <div class="kpi-value">${formatCurrency(data.relatorioAnual.totalReceitas)}</div>
                                </div>
                                <div class="kpi" style="border-left-color: #f43f5e;">
                                    <div class="kpi-title">Despesas Consolidadas</div>
                                    <div class="kpi-value">${formatCurrency(data.relatorioAnual.totalDespesas)}</div>
                                </div>
                                <div class="kpi" style="border-left-color: #eab308;">
                                    <div class="kpi-title">Resultado Líquido</div>
                                    <div class="kpi-value">${formatCurrency(net)}</div>
                                </div>
                                <div class="kpi" style="border-left-color: #4f46e5;">
                                    <div class="kpi-title">Saldo de Caixa Atual</div>
                                    <div class="kpi-value">${formatCurrency(data.relatorioAnual.saldoTotal)}</div>
                                </div>
                            </div>
                            
                            <h3 class="section-title">Resumo de Contas Consolidado</h3>
                            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px;">
                                <div>
                                    <h4 style="color: #0f172a; margin-bottom: 10px; border-bottom: 1px solid #e2e8f0; padding-bottom: 5px;">Fontes de Receitas</h4>
                                    <table>
                                        <thead><tr><th>Rubrica</th><th style="text-align: right;">Total</th></tr></thead>
                                        <tbody>${recRows}</tbody>
                                    </table>
                                </div>
                                <div>
                                    <h4 style="color: #0f172a; margin-bottom: 10px; border-bottom: 1px solid #e2e8f0; padding-bottom: 5px;">Centros de Custos</h4>
                                    <table>
                                        <thead><tr><th>Rubrica</th><th style="text-align: right;">Total</th></tr></thead>
                                        <tbody>${despRows}</tbody>
                                    </table>
                                </div>
                            </div>

                            <h3 class="section-title">Detalhamento Cronológico Mensal (Exercício)</h3>
                            <table>
                                <thead>
                                    <tr>
                                        <th>Mês</th>
                                        <th style="text-align: right;">Saldo Anterior</th>
                                        <th style="text-align: right;">Dízimos</th>
                                        <th style="text-align: right;">Ofertas</th>
                                        <th style="text-align: right;">Receitas</th>
                                        <th style="text-align: right;">Despesas</th>
                                        <th style="text-align: right;">Resultado</th>
                                        <th style="text-align: right;">Saldo Final</th>
                                    </tr>
                                </thead>
                                <tbody>${monthlyRows}</tbody>
                            </table>
                        </div>
                    `;
                } else {
                    // --- RELATÓRIO DE MÊS ESPECÍFICO ---
                    const monthObj = data.baseGraf.find(m => m.id === selectedMonth);
                    if (!monthObj) return;

                    exportTitle = `Balanço Mensal - ${monthObj.mes}`;

                    const subNet = monthObj.totalReceitas - monthObj.totalDespesas;

                    exportContent = `
                        <div class="card">
                            <div class="header">
                                <h1 class="title">Igreja Presbiteriana do Centenário</h1>
                                <p style="color: #64748b; margin-top: 5px;">Relatório Contabilístico de Transição - Mês de <strong>${monthObj.mes}</strong></p>
                            </div>
                            <div class="kpi-grid">
                                <div class="kpi" style="border-left-color: #10b981;">
                                    <div class="kpi-title">Receita do Mês</div>
                                    <div class="kpi-value">${formatCurrency(monthObj.totalReceitas)}</div>
                                </div>
                                <div class="kpi" style="border-left-color: #f43f5e;">
                                    <div class="kpi-title">Despesa do Mês</div>
                                    <div class="kpi-value">${formatCurrency(monthObj.totalDespesas)}</div>
                                </div>
                                <div class="kpi" style="border-left-color: #eab308;">
                                    <div class="kpi-title">Resultado Líquido</div>
                                    <div class="kpi-value">${formatCurrency(subNet)}</div>
                                </div>
                                <div class="kpi" style="border-left-color: #4f46e5;">
                                    <div class="kpi-title">Saldo Final do Mês</div>
                                    <div class="kpi-value">${formatCurrency(monthObj.saldoTotal)}</div>
                                </div>
                            </div>

                            <h3 class="section-title">Decomposição Detalhada do Período</h3>
                            <table>
                                <thead>
                                    <tr>
                                        <th>Descrição / Lançamento</th>
                                        <th style="text-align: right;">Valor</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr>
                                        <td>Saldo Inicial em Caixa (Início do Mês)</td>
                                        <td style="text-align: right; color: #64748b; font-weight: bold;">${formatCurrency(monthObj.saldoAnterior)}</td>
                                    </tr>
                                    <tr>
                                        <td>Arrecadação de Dízimos</td>
                                        <td style="text-align: right; color: #059669;">${formatCurrency(monthObj.dizimos)}</td>
                                    </tr>
                                    <tr>
                                        <td>Ofertas Livres</td>
                                        <td style="text-align: right; color: #059669;">${formatCurrency(monthObj.ofertas)}</td>
                                    </tr>
                                    <tr>
                                        <td>Ofertas de Projetos Missionários</td>
                                        <td style="text-align: right; color: #059669;">${formatCurrency(monthObj.ofertasMissionarias)}</td>
                                    </tr>
                                    <tr>
                                        <td>Repasses e Taxas Presbiteriais</td>
                                        <td style="text-align: right; color: #0f172a;">${formatCurrency(monthObj.presbiterio)}</td>
                                    </tr>
                                    <tr>
                                        <td>Outras Receitas Correntes</td>
                                        <td style="text-align: right; color: #0f172a;">${formatCurrency(monthObj.outrasReceitas)}</td>
                                    </tr>
                                    <tr style="background-color: #f8fafc; font-weight: bold;">
                                        <td>Total de Despesas Operacionais Liquidada</td>
                                        <td style="text-align: right; color: #dc2626;">${formatCurrency(monthObj.totalDespesas)}</td>
                                    </tr>
                                    <tr style="background-color: #f1f5f9; font-weight: bold; font-size: 14px;">
                                        <td>Saldo de Liquidez Acumulada em Caixa</td>
                                        <td style="text-align: right; color: #1e1b4b;">${formatCurrency(monthObj.saldoTotal)}</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    `;
                }

                const fullHTML = `
                    <!DOCTYPE html>
                    <html lang="pt-PT">
                    <head>
                        <meta charset="UTF-8">
                        <title>${exportTitle}</title>
                        <style>
                            body { font-family: sans-serif; background-color: #f8fafc; color: #1e293b; padding: 40px; margin: 0; }
                            .card { background: white; border-radius: 16px; border: 1px solid #e2e8f0; padding: 35px; max-w-5xl; margin: 0 auto; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
                            .header { text-align: center; border-bottom: 2px solid #f1f5f9; padding-bottom: 20px; margin-bottom: 30px; }
                            .title { font-size: 26px; font-weight: bold; color: #1e1b4b; margin: 0; }
                            .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 30px; }
                            .kpi { background: #f8fafc; padding: 18px; border-radius: 10px; border-left: 4px solid #4f46e5; box-shadow: inset 0 1px 2px rgba(0,0,0,0.02); }
                            .kpi-title { font-size: 10px; font-weight: bold; text-transform: uppercase; color: #64748b; letter-spacing: 0.5px; }
                            .kpi-value { font-size: 20px; font-weight: bold; color: #0f172a; margin-top: 5px; }
                            .section-title { color: #1e1b4b; border-bottom: 2px solid #e2e8f0; padding-bottom: 8px; margin-top: 40px; margin-bottom: 15px; font-size: 18px; }
                            table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
                            th { background: #f8fafc; padding: 10px; text-align: left; border-bottom: 2px solid #e2e8f0; font-weight: bold; text-transform: uppercase; font-size: 11px; color: #64748b; }
                            td { padding: 10px; border-bottom: 1px solid #f1f5f9; }
                            tr:hover { background-color: #fcfdfe; }
                            @media print {
                                body { background-color: white; padding: 0; }
                                .card { border: none; box-shadow: none; padding: 0; }
                            }
                        </style>
                    </head>
                    <body>
                        ${exportContent}
                        <div style="margin-top: 40px; text-align: center; font-size: 11px; color: #94a3b8; border-top: 1px solid #f1f5f9; padding-top: 20px;">
                            Documento gerado eletronicamente em ${new Date().toLocaleDateString('pt-PT')} às ${new Date().toLocaleTimeString('pt-PT')} — Software de Planeamento & Gestão Financeira IPC
                        </div>
                    </body>
                    </html>
                `;

                // Download limpo
                const dataUri = 'data:text/html;charset=utf-8,' + encodeURIComponent(fullHTML);
                const linkElement = document.createElement('a');
                linkElement.setAttribute('href', dataUri);
                linkElement.setAttribute('download', `${exportTitle.toLowerCase().replace(/\s+/g, '_')}.html`);
                linkElement.click();

                // Fechar o modal
                setIsExportOpen(false);
            };

            const kpiValues = calculateKPIs();

            // Renderizadores de Gráficos (Chart.js) para a aba de Estrutura Anual (Relatório 2025)
            // Adaptado para reconstruir a pizza com base no mês filtrado
            const renderYearlyRevenue = (canvas) => {
                const ctx = canvas.getContext('2d');
                let labels = [];
                let values = [];
                
                if (selectedMonthFilter === 'all') {
                    labels = data.relatorioAnual.receitas.map(r => r.label);
                    values = data.relatorioAnual.receitas.map(r => r.value);
                } else {
                    const m = data.baseGraf.find(item => item.id === selectedMonthFilter);
                    labels = ['Dízimos', 'Ofertas Livres', 'Ofertas Missionárias', 'Presbitério', 'Outras Receitas'];
                    values = m ? [m.dizimos, m.ofertas, m.ofertasMissionarias, m.presbiterio, m.outrasReceitas] : [0, 0, 0, 0, 0];
                }

                return new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: labels,
                        datasets: [{
                            data: values,
                            backgroundColor: ['#10b981', '#3b82f6', '#f59e0b', '#8b5cf6', '#ec4899'],
                            borderWidth: 2
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 10 } } }
                        },
                        cutout: '65%'
                    }
                });
            };

            // Adaptado para reagir ao filtro do mês
            const renderYearlyExpenses = (canvas) => {
                const ctx = canvas.getContext('2d');
                let labels = [];
                let values = [];

                if (selectedMonthFilter === 'all') {
                    labels = data.relatorioAnual.despesas.map(d => d.label);
                    values = data.relatorioAnual.despesas.map(d => d.value);
                } else {
                    const m = data.baseGraf.find(item => item.id === selectedMonthFilter);
                    const val = m ? m.totalDespesas : 0;
                    labels = ["Pessoal e Encargos", "Manutenção de Instalações", "Eventos", "Administração Geral"];
                    values = [val * 0.65, val * 0.15, val * 0.10, val * 0.10];
                }

                return new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'Despesa Acumulada R$',
                            data: values,
                            backgroundColor: '#f43f5e',
                            borderRadius: 4
                        }]
                    },
                    options: {
                        indexAxis: 'y',
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: {
                            x: { ticks: { font: { size: 9 } } },
                            y: { ticks: { font: { size: 9 } } }
                        }
                    }
                });
            };

            // Adaptado para mostrar o comparativo real vs planeado do mês específico
            const renderBudgetComparisonChart = (canvas) => {
                const ctx = canvas.getContext('2d');
                let items = [];
                if (selectedMonthFilter === 'all') {
                    items = data.relatorioAnual.orcadoRealizado;
                } else {
                    const m = data.baseGraf.find(item => item.id === selectedMonthFilter);
                    if (m) {
                        items = [
                            { label: "Dízimos", orcado: 20650, realizado: m.dizimos },
                            { label: "Ofertas", orcado: 300, realizado: m.ofertas },
                            { label: "Ofertas Missionárias", orcado: 500, realizado: m.ofertasMissionarias },
                            { label: "Presbitério", orcado: 402.60, realizado: m.presbiterio },
                            { label: "Outras Receitas", orcado: 0, realizado: m.outrasReceitas },
                            { label: "Despesas Totais", orcado: 21000, realizado: m.totalDespesas }
                        ];
                    } else {
                        items = data.relatorioAnual.orcadoRealizado;
                    }
                }

                return new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: items.map(o => o.label),
                        datasets: [
                            {
                                label: 'Meta Planeada (Mês)',
                                data: items.map(o => o.orcado),
                                backgroundColor: 'rgba(148, 163, 184, 0.7)',
                                borderRadius: 4
                            },
                            {
                                label: 'Realizado (Mês)',
                                data: items.map(o => o.realizado),
                                backgroundColor: '#4f46e5',
                                borderRadius: 4
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { position: 'top', labels: { font: { size: 10 } } }
                        },
                        scales: {
                            y: { ticks: { font: { size: 9 } } },
                            x: { ticks: { font: { size: 8 } } }
                        }
                    }
                });
            };

            return (
                <div class="flex-grow flex flex-col">
                    {/* Header */}
                    <Header 
                        onImportDemo={handleImportDemo} 
                        dataLoaded={!!data} 
                        onClear={handleClear}
                        onExportHTML={() => setIsExportOpen(true)}
                        dataSource={data === IPC_2025_DEMO_DATA ? "Demonstração" : "Ficheiro Excel"}
                    />

                    {/* Área Principal */}
                    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">
                        {data ? (
                            <div class="space-y-8 animate-fadeIn">
                                {/* Painel de Filtro de Período Global */}
                                <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 flex flex-col sm:flex-row justify-between items-center gap-4 transition-all hover:shadow-md">
                                    <div class="flex items-center gap-3">
                                        <span class="p-2 bg-indigo-50 text-indigo-700 rounded-lg">
                                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z" />
                                            </svg>
                                        </span>
                                        <div>
                                            <h3 class="font-bold text-slate-800 text-sm">Filtro de Período Corrente</h3>
                                            <p class="text-xs text-slate-500">Altere o filtro para atualizar todos os KPIs, tabelas e composições de saldos</p>
                                        </div>
                                    </div>
                                    <div class="w-full sm:w-72">
                                        <select 
                                            value={selectedMonthFilter}
                                            onChange={(e) => setSelectedMonthFilter(e.target.value)}
                                            class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-sm font-bold text-slate-700 outline-none focus:ring-2 focus:ring-indigo-500 transition-all cursor-pointer hover:bg-slate-100"
                                        >
                                            <option value="all">📅 Todos os Meses (Acumulado Anual)</option>
                                            {data.baseGraf.map(m => (
                                                <option key={m.id} value={m.id}>📆 {m.mes} (2025)</option>
                                            ))}
                                        </select>
                                    </div>
                                </div>

                                {/* Grelha de KPIs */}
                                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                                    <KpiCard 
                                        title={selectedMonthFilter === 'all' ? "Arrecadação Anual" : "Arrecadação Mensal"} 
                                        value={kpiValues.totalRevenues} 
                                        type="revenue"
                                        subtitle={selectedMonthFilter === 'all' ? "Total consolidado de entradas" : "Arrecadação no mês selecionado"}
                                    />
                                    <KpiCard 
                                        title={selectedMonthFilter === 'all' ? "Despesa Anual" : "Despesa Mensal"} 
                                        value={kpiValues.totalExpenses} 
                                        type="expense"
                                        subtitle={selectedMonthFilter === 'all' ? "Total consolidado de saídas" : "Despesa liquidada no mês"}
                                    />
                                    <KpiCard 
                                        title="Resultado Contabilístico" 
                                        value={kpiValues.netBalance} 
                                        type={kpiValues.isPositive ? "revenue" : "expense"}
                                        subtitle={kpiValues.isPositive ? "Superávit do período" : "Défice do período"}
                                    />
                                    <KpiCard 
                                        title="Saldo de Caixa Final" 
                                        value={kpiValues.currentLiquidity} 
                                        type="balance"
                                        subtitle="Saldo global de tesouraria"
                                    />
                                </div>

                                {/* Menu de Abas */}
                                <div class="border-b border-slate-200">
                                    <nav class="flex space-x-6">
                                        {[
                                            { id: 'baseGraf', name: '📊 Evolução Mensal (Base Graf.)' },
                                            { id: 'composicao', name: '📈 Estrutura Anual (Relatório 2025)' },
                                            { id: 'planeamento', name: '🎯 Controlo Orçamental (Mês)' },
                                            { id: 'tabelas', name: '📑 Listagem de Contas' }
                                        ].map(tab => (
                                            <button
                                                key={tab.id}
                                                onClick={() => setActiveTab(tab.id)}
                                                class={`pb-4 text-sm font-bold tracking-tight border-b-2 transition-all flex items-center gap-1.5 ${activeTab === tab.id ? 'border-indigo-600 text-indigo-900' : 'border-transparent text-slate-400 hover:text-slate-600'}`}
                                            >
                                                {tab.name}
                                            </button>
                                        ))}
                                    </nav>
                                </div>

                                {/* Secções Dinâmicas baseadas na navegação */}
                                {activeTab === 'baseGraf' && (
                                    <MonthlyTrendView baseGraf={data.baseGraf} selectedMonthFilter={selectedMonthFilter} />
                                )}

                                {activeTab === 'composicao' && (
                                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 animate-fadeIn">
                                        <ChartContainer 
                                            title={selectedMonthFilter === 'all' ? "Composição de Receitas Realizadas (Anual)" : "Composição de Receitas Realizadas (Mês)"} 
                                            subtitle="Percentagem de dízimos, ofertas e demais receitas"
                                            chartId="yearlyRevenue"
                                            renderChartFn={renderYearlyRevenue}
                                            dependencies={[data, selectedMonthFilter]}
                                        />
                                        <ChartContainer 
                                            title={selectedMonthFilter === 'all' ? "Distribuição de Despesas Acumuladas (Anual)" : "Distribuição de Despesas Estimada (Mês)"} 
                                            subtitle="Visualização consolidada de saídas por centro de custos"
                                            chartId="yearlyExpenses"
                                            renderChartFn={renderYearlyExpenses}
                                            dependencies={[data, selectedMonthFilter]}
                                        />
                                    </div>
                                )}

                                {activeTab === 'planeamento' && (
                                    <div class="space-y-6 animate-fadeIn">
                                        <ChartContainer 
                                            title="Desempenho Orçamental (Metas vs. Realizado)" 
                                            subtitle="Análise comparativa das contas com as previsões estabelecidas"
                                            chartId="budgetComp"
                                            renderChartFn={renderBudgetComparisonChart}
                                            dependencies={[data, selectedMonthFilter]}
                                        />
                                    </div>
                                )}

                                {activeTab === 'tabelas' && (
                                    <ConsolidatedTables data={data} selectedMonthFilter={selectedMonthFilter} />
                                )}
                            </div>
                        ) : (
                            <DataLoader 
                                onDataImport={handleDataImport} 
                                onImportDemo={handleImportDemo} 
                                errorMsg={errorMsg}
                            />
                        )}
                    </main>

                    {/* Modal de Exportação */}
                    <ExportModal 
                        isOpen={isExportOpen} 
                        onClose={() => setIsExportOpen(false)} 
                        months={data ? data.baseGraf : []}
                        onExport={handleExportReport}
                    />

                    {/* Rodapé */}
                    <footer class="bg-slate-100 border-t border-slate-200 py-6 text-center text-xs text-slate-400 font-semibold tracking-wide mt-auto">
                        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row justify-between items-center gap-3">
                            <span>Igreja Presbiteriana do Centenário — © 2026</span>
                            <span class="text-slate-400">Software de Planeamento & Gestão Financeira</span>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);

    </script>
</body>
</html>
